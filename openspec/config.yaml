schema: spec-driven

context: |
  Proyecto Final Parte 2, EIF400, II Ciclo 2026. Evaluaciones en vivo para ProfeLink.
  Este cambio cubre solo el frontend web en React y TypeScript.
  La autenticación, la API de actividades, la base de datos, el tiempo real,
  Docker, OpenAPI y la observabilidad pertenecen a otros módulos y se consumen por red.
  La interfaz usa fondo oscuro y azul eléctrico. El catálogo se comporta como una
  exploración de cuestionarios. Las preguntas son de verdadero o falso.
  No inventar estadísticas de participación. Los datos de prueba deben identificarse.
  Las imágenes se muestran desde una URL del servicio, no solo desde el navegador local.

