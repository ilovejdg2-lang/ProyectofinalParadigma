services:
  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 384m
    volumes:
      - ./observability/tempo-prod.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
    healthcheck:
      test: ["CMD", "/tempo", "--health", "--health.url=http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 384m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      tempo:
        condition: service_healthy
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

networks:
  observability:
    external: true
    name: profelink-observability

volumes:
  tempo-data:
    name: profelink-tempo-data
  grafana-data:
    name: profelink-grafana-data
