services:
  auth-service:
    build:
      context: ./autenticacion
      dockerfile: Dockerfile
    container_name: profelink-auth-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FRONTEND_URL=http://localhost:5173
      - JWT_ISSUER=http://localhost:5001
      - JWT_AUDIENCE=profelink-actividades
      - JWT_ACCESS_MINUTES=15
      - JWT_REFRESH_DAYS=7
      - REGISTRATION_MODE=open
      - EMAIL_AUTO_VERIFY=true
      - RSA_KEYS_DIR=/app/datos/keys
    volumes:
      - auth-keys:/app/datos/keys
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Servicio de Actividades (Persona 2)
  actividades:
    build:
      context: ./actividades
      dockerfile: Dockerfile
    container_name: profelink-actividades
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - FRONTEND_URL=http://localhost:5173
      - AUTH_URL=http://auth-service:5001
      - AUTH_JWKS_URL=http://auth-service:5001/.well-known/jwks.json
      - JWT_AUDIENCE=profelink-actividades
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5002/salud"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  auth-keys:
    name: profelink-auth-keys
