name: Temporary PR 24 Linux Auth Persistence

on:
  push:
    branches:
      - codex/pr24-linux-auth-check-20261110

permissions:
  contents: read

jobs:
  auth-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_useexisting_pr24
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_useexisting_pr24"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/auth_useexisting_pr24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: autenticacion/package-lock.json

      - name: Install Auth dependencies
        working-directory: autenticacion
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: autenticacion
        run: npm run prisma:generate

      - name: Apply Auth migrations to disposable PostgreSQL
        working-directory: autenticacion
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:deploy

      - name: Build Auth service
        working-directory: autenticacion
        run: npm run build

      - name: Start Auth service and seed demo users
        working-directory: autenticacion
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
          PORT: 5001
          RSA_KEYS_DIR: ${{ runner.temp }}/pr24-auth-keys
          JWT_ISSUER: http://localhost:5001
          JWT_AUDIENCE: profelink-actividades
        run: |
          set -euo pipefail
          mkdir -p "$RSA_KEYS_DIR"
          npm run start:prod > "$RUNNER_TEMP/auth-service.log" 2>&1 &
          auth_pid=$!
          trap 'kill "$auth_pid" 2>/dev/null || true; wait "$auth_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5001/health/ready > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$auth_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/auth-service.log"
              exit 1
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/auth-service.log"
          echo "Auth service did not become ready in time." >&2
          exit 1

      - name: Verify persisted Auth demo users
        working-directory: autenticacion
        env:
          AUTH_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm test -- --runInBand --runTestsByPath src/prisma/prisma.persistence.integration.spec.ts
